<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinaryHub</title>
<meta name="description" content="MinaryHub 공개 프로젝트 소개 및 최신 빌드 다운로드">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ed; --border: #e3e3de;
    --text: #1b1b19; --muted: #6b6b66; --accent: #2f5bea; --accent-ink: #ffffff;
    --accent-soft: #e8eefe; --ok: #1f8a4c; --radius: 14px; --logo-bg: transparent; --logo-pad: 0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #19191c; --surface-2: #222226; --border: #2c2c31;
      --text: #ececee; --muted: #9a9aa3; --accent: #7c9cff; --accent-ink: #0d0d10;
      --accent-soft: #1f2640; --ok: #4cc47f; --shadow: none; --logo-bg: #f3f4ee; --logo-pad: 3px;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Noto Sans KR", system-ui, -apple-system, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { padding: 56px 0 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; flex: none; background: var(--logo-bg); padding: var(--logo-pad); }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 10px 0 0; max-width: 620px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .meta b { color: var(--text); font-weight: 500; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 20px; }
  .search { flex: 1 1 240px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-bottom: 64px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card h2 { font-size: 18px; margin: 0; letter-spacing: -.01em; word-break: break-word; }
  .card h2 a { text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .ver { font: 600 12px "JetBrains Mono", monospace; color: var(--ok); white-space: nowrap; text-decoration: none; }
  .ver.pre { color: #c98a12; }
  .desc { color: var(--muted); margin: 0; flex: 1; }
  .desc.empty { font-style: italic; opacity: .7; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .tag { background: var(--surface-2); color: var(--muted); padding: 2px 8px; border-radius: 6px; }
  .lang::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dot, #999); margin-right: 6px; vertical-align: 1px; }

  .dl { display: flex; flex-direction: column; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none;
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 14px; min-width: 0; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .btn .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .btn .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn .sz { font: 12px "JetBrains Mono", monospace; opacity: .75; white-space: nowrap; }
  .os-ico { width: 16px; height: 16px; flex: none; }
  .more { font-size: 13px; color: var(--muted); }
  .more summary { cursor: pointer; }
  .more .dl { margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 12px; flex-wrap: wrap; }
  .foot a { color: var(--accent); text-decoration: none; }
  .norel { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }

  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { color: var(--muted); font-size: 13px; padding: 24px 0 40px; border-top: 1px solid var(--border); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 26px; } header { padding-top: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img class="logo" src="logo.webp" alt="" width="48" height="48"><h1 id="title">MinaryHub</h1></div>
    <p class="tagline" id="tagline"></p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="프로젝트 검색…" aria-label="프로젝트 검색">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">전체</button>
      <button class="chip" data-f="rel" aria-pressed="false">다운로드 가능</button>
    </div>
  </div>

  <main class="grid" id="grid"><div class="state">불러오는 중…</div></main>

  <footer>
    <a href="https://github.com/MinaryHub" id="orgLink">github.com/MinaryHub</a> · 이 페이지는 GitHub Actions가 주기적으로 릴리스 정보를 갱신합니다.
  </footer>
</div>

<script>
(() => {
  const ORG = 'MinaryHub';
  const LANG_COLORS = { Rust:'#dea584', 'C#':'#178600', TypeScript:'#3178c6', JavaScript:'#f1e05a',
    Dart:'#00B4AB', Python:'#3572A5', MDX:'#fcb32c', Go:'#00ADD8', 'C++':'#f34b7d', Kotlin:'#A97BFF', Swift:'#F05138' };
  const OS_LABEL = { win: 'Windows', mac: 'macOS', linux: 'Linux', android: 'Android', other: '기타' };
  const ICONS = {
    win: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10 4.5v7H3zM11 4.3 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/></svg>',
    mac: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8s-1.8-.8-3-.8c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.2 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6 0 0-2.5-1-2.5-3.6zM14.1 5.6c.6-.8 1.1-1.8 1-2.9-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>',
    linux: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-2.2 0-3.6 1.9-3.6 4.6 0 1.4.4 2.4-.6 4-1 1.5-2.6 3.6-2.6 6 0 .8.2 1.4.5 1.9-.6.4-1.2.9-1.2 1.6 0 1.1 1.6 1.4 3.4 1.9 1.1.3 1.7 0 2.2-.4.5.1 1 .2 1.9.2s1.4-.1 1.9-.2c.5.4 1.1.7 2.2.4 1.8-.5 3.4-.8 3.4-1.9 0-.7-.6-1.2-1.2-1.6.3-.5.5-1.1.5-1.9 0-2.4-1.6-4.5-2.6-6-1-1.6-.6-2.6-.6-4C15.6 3.9 14.2 2 12 2zm-1.5 4.5c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zm3 0c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zM12 9.3c.9 0 2 .6 2 1s-1.1 1.2-2 1.2-2-.8-2-1.2 1.1-1 2-1z"/></svg>',
    android: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 9h10v8a1 1 0 0 1-1 1h-1v3h-2v-3h-2v3H9v-3H8a1 1 0 0 1-1-1zM4.5 9a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0v-5a1 1 0 0 1 1-1zm15 0a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0v-5a1 1 0 0 1 1-1zM7.2 8a4.9 4.9 0 0 1 2.4-3.6l-.9-1.5.5-.3 1 1.6a5 5 0 0 1 3.6 0l1-1.6.5.3-.9 1.5A4.9 4.9 0 0 1 16.8 8z"/></svg>',
    other: '<svg class="os-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>'
  };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtSize = (b) => b >= 1<<30 ? (b/(1<<30)).toFixed(1)+' GB' : b >= 1<<20 ? (b/(1<<20)).toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB';
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('ko-KR', { year:'numeric', month:'short', day:'numeric' }) : '';
  const ago = (d) => { const s = (Date.now() - new Date(d)) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s/60)) + '분 전'; if (s < 86400) return Math.round(s/3600) + '시간 전';
    return Math.round(s/86400) + '일 전'; };

  function classify(name) {
    const n = name.toLowerCase();
    let os = 'other';
    if (/\.apk$|\.aab$|android/.test(n)) os = 'android';
    else if (/win|windows|\.exe$|\.msi$|\.msix|\.appx/.test(n)) os = 'win';
    else if (/mac|darwin|osx|\.dmg$|\.pkg$/.test(n)) os = 'mac';
    else if (/linux|\.appimage$|\.deb$|\.rpm$|\.flatpak$|\.snap$/.test(n)) os = 'linux';
    const arch = /arm64|aarch64/.test(n) ? 'arm64' : /x64|amd64|x86_64/.test(n) ? 'x64' : /x86|i[36]86|win32/.test(n) ? 'x86' : /universal/.test(n) ? 'universal' : '';
    return { os, arch };
  }

  function detectOS() {
    const ua = navigator.userAgent.toLowerCase();
    const p = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
    if (/android/.test(ua)) return 'android';
    if (/win/.test(p) || /windows/.test(ua)) return 'win';
    if (/mac/.test(p) || /mac os/.test(ua)) return /iphone|ipad/.test(ua) ? 'other' : 'mac';
    if (/linux/.test(p) || /linux/.test(ua)) return 'linux';
    return 'other';
  }
  const userOS = detectOS();

  // 데이터 로드: Actions가 만든 data/repos.json 우선 → 없으면 GitHub API 직접 호출(30분 캐시)
  async function loadData() {
    try {
      const r = await fetch('data/repos.json', { cache: 'no-cache' });
      if (r.ok) return await r.json();
    } catch {}
    return loadFromApi();
  }

  async function loadFromApi() {
    const KEY = 'mh-cache-v1';
    try { const c = JSON.parse(localStorage.getItem(KEY)); if (c && Date.now() - c.t < 30*60*1000) return c.d; } catch {}
    const api = (p) => fetch('https://api.github.com' + p, { headers: { Accept: 'application/vnd.github+json' } })
      .then((r) => r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error('GitHub API ' + r.status)));
    const list = await api(`/orgs/${ORG}/repos?type=public&per_page=100`);
    const repos = await Promise.all(list.filter((r) => !r.fork && !r.archived && r.name !== '.github' &&
      r.name.toLowerCase() !== ORG.toLowerCase() + '.github.io').map(async (r) => {
      const rel = await api(`/repos/${ORG}/${r.name}/releases/latest`).catch(() => null);
      return { name: r.name, displayName: r.name, description: r.description || '', url: r.html_url,
        homepage: r.homepage || '', language: r.language, topics: r.topics || [], pushedAt: r.pushed_at,
        release: rel && { tag: rel.tag_name, name: rel.name || rel.tag_name, url: rel.html_url,
          publishedAt: rel.published_at, prerelease: rel.prerelease,
          assets: rel.assets.filter((a) => !/\.(sha256|sha512|sig|asc|blockmap|ya?ml|txt|json|cer|aab)$|checksums?/i.test(a.name))
            .map((a) => ({ name: a.name, size: a.size, downloads: a.download_count, url: a.browser_download_url })) } };
    }));
    repos.sort((a, b) => (!!b.release - !!a.release) || new Date(b.release?.publishedAt || b.pushedAt) - new Date(a.release?.publishedAt || a.pushedAt));
    const d = { org: ORG, generatedAt: new Date().toISOString(), repos, live: true };
    try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d })); } catch {}
    return d;
  }

  function assetBtn(a, primary) {
    const { os, arch } = classify(a.name);
    const archLabel = os === 'mac' ? ({ arm64: 'Apple Silicon', x64: 'Intel', universal: 'Universal' }[arch] || '') : arch;
    const label = primary ? `${OS_LABEL[os]}${archLabel ? ' ' + archLabel : ''}용 다운로드` : a.name;
    return `<a class="btn${primary ? ' primary' : ''}" href="${esc(a.url)}" title="${esc(a.name)}" rel="nofollow">
      <span class="l">${ICONS[os]}<span class="fname">${esc(label)}</span></span><span class="sz">${fmtSize(a.size)}</span></a>`;
  }

  function card(r) {
    const rel = r.release;
    const color = LANG_COLORS[r.language] || '#999';
    let dl = '';
    if (rel && rel.assets.length) {
      const scored = rel.assets.map((a) => { const c = classify(a.name);
        const archScore = userOS === 'mac'
          ? ({ universal: 3, arm64: 2, x64: 1 }[c.arch] || 0)   // Mac: Apple Silicon 우선
          : ({ x64: 2, universal: 2 }[c.arch] || 0);
        const fmtScore = userOS === 'linux' ? (/\.(appimage|deb|tar\.gz)$/i.test(a.name) ? 1 : 0) : (/\.zip$/i.test(a.name) ? 0.5 : 0);
        return { a, s: (c.os === userOS ? 10 : 0) + archScore + fmtScore + (/setup|install|\.msi$|\.dmg$/i.test(a.name) ? 1 : 0) }; })
        .sort((x, y) => y.s - x.s);
      const best = scored[0].s >= 10 ? scored[0].a : null;
      const rest = rel.assets.filter((a) => a !== best);
      dl = `<div class="dl">${best ? assetBtn(best, true) : ''}${!best && rest.length <= 3 ? rest.map((a) => assetBtn(a)).join('') : ''}</div>`;
      if (best || rest.length > 3) {
        const others = best ? rest : rel.assets;
        if (others.length) dl += `<details class="more"><summary>다른 플랫폼 · 파일 ${others.length}개</summary><div class="dl">${others.map((a) => assetBtn(a)).join('')}</div></details>`;
      }
    } else if (rel) {
      dl = `<div class="norel">첨부 파일이 없는 릴리스입니다. <a href="${esc(rel.url)}">릴리스 노트 보기</a></div>`;
    } else {
      dl = `<div class="norel">아직 공개된 빌드가 없습니다 — 소스에서 직접 빌드할 수 있습니다.</div>`;
    }
    return `<article class="card" data-rel="${rel ? 1 : 0}" data-q="${esc((r.displayName + ' ' + r.name + ' ' + r.description + ' ' + (r.language||'') + ' ' + r.topics.join(' ')).toLowerCase())}">
      <div class="card-top"><h2><a href="${esc(r.url)}">${esc(r.displayName)}</a></h2>
        ${rel ? `<a class="ver${rel.prerelease ? ' pre' : ''}" href="${esc(rel.url)}" title="${esc(rel.name)}">${esc(rel.tag)}${rel.prerelease ? ' · pre' : ''}</a>` : ''}</div>
      <p class="desc${r.description ? '' : ' empty'}">${esc(r.description || '설명이 아직 없습니다.')}</p>
      <div class="tags">${r.language ? `<span class="tag lang" style="--dot:${color}">${esc(r.language)}</span>` : ''}${r.topics.slice(0, 4).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${dl}
      <div class="foot"><span>${rel ? '릴리스 ' + fmtDate(rel.publishedAt) : '최근 업데이트 ' + fmtDate(r.pushedAt)}</span>
        <span>${r.homepage ? `<a href="${esc(r.homepage)}">홈페이지</a> · ` : ''}<a href="${esc(r.url)}">저장소 →</a></span></div>
    </article>`;
  }

  let filter = 'all';
  function applyFilter() {
    const q = $('#q').value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('.card').forEach((el) => {
      const ok = (filter === 'all' || el.dataset.rel === '1') && (!q || el.dataset.q.includes(q));
      el.hidden = !ok; if (ok) shown++;
    });
    $('#empty')?.remove();
    if (!shown) $('#grid').insertAdjacentHTML('beforeend', '<div class="state" id="empty">조건에 맞는 프로젝트가 없습니다.</div>');
  }

  (async () => {
    try {
      const cfg = await fetch('config.json').then((r) => r.ok ? r.json() : {}).catch(() => ({}));
      if (cfg.title) { $('#title').textContent = cfg.title; document.title = cfg.title; }
      $('#tagline').textContent = cfg.tagline || '';
      const data = await loadData();
      const repos = data.repos;
      const nRel = repos.filter((r) => r.release).length;
      $('#meta').innerHTML = `공개 프로젝트 <b>${repos.length}</b>개 · 다운로드 가능 <b>${nRel}</b>개 · 정보 갱신 ${ago(data.generatedAt)}` +
        (userOS !== 'other' ? ` · 내 환경: <b>${OS_LABEL[userOS]}</b>` : '');
      $('#grid').innerHTML = repos.length ? repos.map(card).join('') : '<div class="state">공개된 프로젝트가 없습니다.</div>';
      $('#q').addEventListener('input', applyFilter);
      $('#chips').addEventListener('click', (e) => {
        const b = e.target.closest('.chip'); if (!b) return;
        filter = b.dataset.f;
        document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
        applyFilter();
      });
    } catch (e) {
      $('#grid').innerHTML = `<div class="state">프로젝트 정보를 불러오지 못했습니다. (${esc(e.message)})<br>
        <a href="https://github.com/${ORG}">GitHub에서 직접 보기 →</a></div>`;
    }
  })();
})();
</script>
</body>
</html>
