<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinaryHub</title>
<meta name="description" content="MinaryHub open-source projects and their latest builds">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ed; --border: #e3e3de;
    --text: #1b1b19; --muted: #6b6b66; --accent: #2f5bea; --accent-ink: #ffffff;
    --accent-soft: #e8eefe; --ok: #1f8a4c; --radius: 14px; --logo-bg: transparent; --logo-pad: 0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #19191c; --surface-2: #222226; --border: #2c2c31;
      --text: #ececee; --muted: #9a9aa3; --accent: #7c9cff; --accent-ink: #0d0d10;
      --accent-soft: #1f2640; --ok: #4cc47f; --shadow: none; --logo-bg: #f3f4ee; --logo-pad: 3px;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Noto Sans KR", system-ui, -apple-system, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { padding: 56px 0 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .lang-sw { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
  .lang-sw a { color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 999px; text-decoration: none; }
  .lang-sw a[aria-pressed="true"], .lang-sw a[aria-current="page"] { background: var(--text); color: var(--bg); }
  .logo { width: 48px; height: 48px; border-radius: 50%; flex: none; background: var(--logo-bg); padding: var(--logo-pad); }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 10px 0 0; max-width: 620px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .meta b { color: var(--text); font-weight: 500; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 20px; }
  .search { flex: 1 1 240px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-bottom: 64px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .ttl { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .app-ico { width: 40px; height: 40px; border-radius: 10px; flex: none; object-fit: contain; }
  .app-ico.ph { display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-weight: 700; }
  /* 스크린샷 슬라이더: 한 장씩 표시, 스와이프·화살표·점으로 넘김, 클릭 시 크게 보기 */
  .shots { position: relative; border-radius: 10px; overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--border); aspect-ratio: 16 / 10; }
  .shots .track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: none; overscroll-behavior-x: contain; }
  .shots .track::-webkit-scrollbar { display: none; }
  .shots .slide { all: unset; box-sizing: border-box; flex: 0 0 100%; height: 100%; scroll-snap-align: start; cursor: zoom-in; }
  .shots .slide img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shots .slide:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .shots .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.5); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .2s; }
  .shots .prev { left: 8px; } .shots .next { right: 8px; }
  .shots:hover .nav, .shots .nav:focus-visible { opacity: 1; }
  @media (hover: none) { .shots .nav { display: none; } }
  .shots .dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .shots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); box-shadow: 0 0 2px rgba(0,0,0,.6); transition: all .2s; }
  .shots .dot.on { background: #fff; width: 16px; border-radius: 3px; }
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 50; place-items: center; padding: 48px 16px; }
  #lb:not([hidden]) { display: grid; }
  #lb img { max-width: 100%; max-height: calc(100vh - 96px); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #lb button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; width: 44px; height: 44px;
    border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; }
  #lb button:hover { background: rgba(255,255,255,.25); }
  .lb-x { top: 12px; right: 12px; } .lb-p { left: 12px; top: 50%; } .lb-n { right: 12px; top: 50%; }
  .lb-c { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ccc; font-size: 13px; }
  .card h2 { font-size: 18px; margin: 0; letter-spacing: -.01em; word-break: break-word; }
  .card h2 a { text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .ver { font: 600 12px "JetBrains Mono", monospace; color: var(--ok); white-space: nowrap; text-decoration: none; }
  .ver.pre { color: #c98a12; }
  .desc { color: var(--muted); margin: 0; flex: 1; }
  .desc.empty { font-style: italic; opacity: .7; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .tag { background: var(--surface-2); color: var(--muted); padding: 2px 8px; border-radius: 6px; }
  .lang::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dot, #999); margin-right: 6px; vertical-align: 1px; }

  .dl { display: flex; flex-direction: column; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none;
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 14px; min-width: 0; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .btn .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .btn .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn .sz { font: 12px "JetBrains Mono", monospace; opacity: .75; white-space: nowrap; }
  .os-ico { width: 16px; height: 16px; flex: none; }
  .more { font-size: 13px; color: var(--muted); }
  .more summary { cursor: pointer; }
  .more .dl { margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 12px; flex-wrap: wrap; }
  .foot a { color: var(--accent); text-decoration: none; }
  .norel { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }

  .star { display: inline-flex; align-items: center; gap: 5px; font: 500 12px "JetBrains Mono", monospace;
    color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 3px 9px; cursor: pointer; }
  .star:hover { border-color: var(--accent); color: var(--text); }
  .star[aria-pressed="true"] { color: #c98a12; border-color: #c98a12; }
  .star:disabled { opacity: .6; cursor: progress; }
  .auth { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .auth button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { color: var(--muted); font-size: 13px; padding: 24px 0 40px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
  footer .credit { color: var(--muted); white-space: nowrap; }
  footer .foot-r { display: flex; gap: 16px; align-items: center; }
  .contact-link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  /* 문의하기 창 (contact.js) */
  dialog.contact { width: min(520px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog.contact::backdrop { background: rgba(0,0,0,.45); }
  dialog.contact h2 { margin: 0 0 16px; font-size: 20px; }
  dialog.contact label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  dialog.contact input, dialog.contact select, dialog.contact textarea { font: inherit; font-size: 15px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; width: 100%; }
  dialog.contact textarea { resize: vertical; min-height: 120px; }
  dialog.contact small { font-size: 12px; }
  dialog.contact .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  dialog.contact .row { display: flex; justify-content: flex-end; gap: 8px; }
  dialog.contact .btn { cursor: pointer; font: inherit; font-size: 14px; }
  dialog.contact .btn.ghost { background: none; color: var(--text); }
  dialog.contact .status { min-height: 1.2em; margin: 0 0 12px; font-size: 14px; }
  dialog.contact .status.err { color: #d14343; } dialog.contact .status.ok { color: var(--ok); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 26px; } header { padding-top: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img class="logo" src="logo.webp" alt="" width="48" height="48"><h1 id="title">MinaryHub</h1>
      <nav class="lang-sw" id="langSw" aria-label="Language"><a href="./" data-lang="en" lang="en" hreflang="en">EN</a><a href="ko/" data-lang="ko" lang="ko" hreflang="ko">한국어</a></nav></div>
    <p class="tagline" id="tagline"></p>
    <div class="meta" id="meta"></div>
    <div class="auth" id="auth" hidden></div>
  </header>

  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Search projects…" aria-label="Search projects">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="rel" aria-pressed="false">Downloadable</button>
    </div>
  </div>

  <main class="grid" id="grid"><div class="state" id="loading">Loading…</div></main>

  <footer>
    <span><a href="https://github.com/MinaryHub" id="orgLink">github.com/MinaryHub</a> · <span id="footNote">This page refreshes release info periodically via GitHub Actions.</span></span>
    <span class="foot-r"><button type="button" class="contact-link" data-contact>Contact</button>
    <a class="credit" href="https://claude.ai" target="_blank" rel="noopener">Produced with Claude</a></span>
  </footer>
</div>

<script>
(() => {
  const ORG = 'MinaryHub';
  const LANG_COLORS = { Rust:'#dea584', 'C#':'#178600', TypeScript:'#3178c6', JavaScript:'#f1e05a',
    Dart:'#00B4AB', Python:'#3572A5', MDX:'#fcb32c', Go:'#00ADD8', 'C++':'#f34b7d', Kotlin:'#A97BFF', Swift:'#F05138' };
  // 언어: 주소의 ?lang=en|ko → 이 페이지의 언어(배포 때 / 는 영어, /ko/ 는 한국어로 만든다) → 기본 영어.
  // 배포된 페이지에서 기억한 선택이 이 페이지와 다르면 그 언어 주소로 옮긴다 (검색엔진은 저장소가 없어 옮겨지지 않는다)
  const prerendered = !!document.documentElement.dataset.prerendered;
  const pageLang = document.documentElement.dataset.lang || 'en';
  let lang = pageLang;
  try {
    const q = new URLSearchParams(location.search).get('lang'), saved = localStorage.getItem('mh-lang');
    if (['en', 'ko'].includes(q)) lang = q;
    else if (prerendered && ['en', 'ko'].includes(saved) && saved !== pageLang) location.replace(new URL(saved === 'ko' ? 'ko/' : './', document.baseURI).href);
    else if (!prerendered && ['en', 'ko'].includes(saved)) lang = saved;
  } catch {}
  const I18N = {
    en: {
      search: 'Search projects…', all: 'All', rel: 'Downloadable', loading: 'Loading…',
      footNote: 'This page refreshes release info periodically via GitHub Actions.', other: 'Other',
      min: (n) => `${n} min ago`, hour: (n) => `${n}h ago`, day: (n) => `${n}d ago`,
      dlFor: (os) => `Download for ${os}`,
      shotOpen: (name, i, n) => `${name} screenshot ${i}/${n} — view larger`, shotAlt: (name, i) => `${name} screenshot ${i}`,
      shotPrev: 'Previous screenshot', shotNext: 'Next screenshot', close: 'Close', prev: 'Previous', next: 'Next',
      webTitle: 'Open the web app', webRun: 'Run in browser', noInstall: 'No install',
      more: (n) => `Other platforms · ${n} file${n === 1 ? '' : 's'}`,
      noAssets: 'This release has no attached files.', notes: 'View release notes', noBuild: 'No public build yet.',
      noDesc: 'No description yet.', released: (d) => `Released ${d}`, updated: (d) => `Updated ${d}`,
      starGive: 'Star on GitHub', starSet: 'Star', starUnset: 'Unstar', starLogin: 'Sign in to GitHub to star',
      signedIn: 'signed in', logout: 'Sign out', starFail: (m) => `Couldn't update the star: ${m}`,
      loginFail: (m) => `GitHub sign-in failed: ${m}`, popup: 'The popup was blocked. Please allow popups for this site.',
      noMatch: 'No projects match.', none: 'No public projects yet.',
      meta: (n, nRel, ago, nLive, os) => `<b>${n}</b> public project${n === 1 ? '' : 's'} · <b>${nRel}</b> downloadable · updated ${ago}` +
        (nLive ? ` · ${nLive} live update${nLive === 1 ? '' : 's'}` : '') + (os ? ` · your system: <b>${os}</b>` : ''),
      loadFail: (m) => `Couldn't load project info. (${m})`, viewGitHub: 'View on GitHub →',
    },
    ko: {
      search: '프로젝트 검색…', all: '전체', rel: '다운로드 가능', loading: '불러오는 중…',
      footNote: '이 페이지는 GitHub Actions가 주기적으로 릴리스 정보를 갱신합니다.', other: '기타',
      min: (n) => `${n}분 전`, hour: (n) => `${n}시간 전`, day: (n) => `${n}일 전`,
      dlFor: (os) => `${os}용 다운로드`,
      shotOpen: (name, i, n) => `${name} 스크린샷 ${i}/${n} 크게 보기`, shotAlt: (name, i) => `${name} 스크린샷 ${i}`,
      shotPrev: '이전 스크린샷', shotNext: '다음 스크린샷', close: '닫기', prev: '이전', next: '다음',
      webTitle: '웹 앱 실행', webRun: '웹에서 바로 실행', noInstall: '설치 없음',
      more: (n) => `다른 플랫폼 · 파일 ${n}개`,
      noAssets: '첨부 파일이 없는 릴리스입니다.', notes: '릴리스 노트 보기', noBuild: '아직 공개된 빌드가 없습니다.',
      noDesc: '설명이 아직 없습니다.', released: (d) => `릴리스 ${d}`, updated: (d) => `최근 업데이트 ${d}`,
      starGive: 'GitHub 별 주기', starSet: '별 주기', starUnset: '별 취소', starLogin: 'GitHub 로그인 후 별 주기',
      signedIn: '로그인됨', logout: '로그아웃', starFail: (m) => `별을 바꾸지 못했습니다: ${m}`,
      loginFail: (m) => `GitHub 로그인 실패: ${m}`, popup: '팝업이 차단되었습니다. 이 사이트의 팝업을 허용해 주세요.',
      noMatch: '조건에 맞는 프로젝트가 없습니다.', none: '공개된 프로젝트가 없습니다.',
      meta: (n, nRel, ago, nLive, os) => `공개 프로젝트 <b>${n}</b>개 · 다운로드 가능 <b>${nRel}</b>개 · 정보 갱신 ${ago}` +
        (nLive ? ` · 새 소식 ${nLive}건 실시간 반영` : '') + (os ? ` · 내 환경: <b>${os}</b>` : ''),
      loadFail: (m) => `프로젝트 정보를 불러오지 못했습니다. (${m})`, viewGitHub: 'GitHub에서 직접 보기 →',
    },
  };
  const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
  // config·저장소 값의 언어별 덮어쓰기: descriptionEn / descriptionKo 처럼 이름 뒤에 En·Ko
  const loc = (o, k) => (o && o[k + (lang === 'en' ? 'En' : 'Ko')]) || (o && o[k]) || '';
  const slugOf = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const i18nFields = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => /^(displayName|description)(En|Ko)$/.test(k)));
  const OS_LABEL = { win: 'Windows', mac: 'macOS', linux: 'Linux', android: 'Android' };
  const osLabel = (os) => OS_LABEL[os] || t('other');
  const ICONS = {
    win: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10 4.5v7H3zM11 4.3 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/></svg>',
    mac: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8s-1.8-.8-3-.8c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 6.9 1.2 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6 0 0-2.5-1-2.5-3.6zM14.1 5.6c.6-.8 1.1-1.8 1-2.9-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>',
    linux: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-2.2 0-3.6 1.9-3.6 4.6 0 1.4.4 2.4-.6 4-1 1.5-2.6 3.6-2.6 6 0 .8.2 1.4.5 1.9-.6.4-1.2.9-1.2 1.6 0 1.1 1.6 1.4 3.4 1.9 1.1.3 1.7 0 2.2-.4.5.1 1 .2 1.9.2s1.4-.1 1.9-.2c.5.4 1.1.7 2.2.4 1.8-.5 3.4-.8 3.4-1.9 0-.7-.6-1.2-1.2-1.6.3-.5.5-1.1.5-1.9 0-2.4-1.6-4.5-2.6-6-1-1.6-.6-2.6-.6-4C15.6 3.9 14.2 2 12 2zm-1.5 4.5c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zm3 0c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zM12 9.3c.9 0 2 .6 2 1s-1.1 1.2-2 1.2-2-.8-2-1.2 1.1-1 2-1z"/></svg>',
    android: '<svg class="os-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M7 9h10v8a1 1 0 0 1-1 1h-1v3h-2v-3h-2v3H9v-3H8a1 1 0 0 1-1-1zM4.5 9a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0v-5a1 1 0 0 1 1-1zm15 0a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0v-5a1 1 0 0 1 1-1zM7.2 8a4.9 4.9 0 0 1 2.4-3.6l-.9-1.5.5-.3 1 1.6a5 5 0 0 1 3.6 0l1-1.6.5.3-.9 1.5A4.9 4.9 0 0 1 16.8 8z"/></svg>',
    other: '<svg class="os-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>',
    web: '<svg class="os-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>'
  };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtSize = (b) => b >= 1<<30 ? (b/(1<<30)).toFixed(1)+' GB' : b >= 1<<20 ? (b/(1<<20)).toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB';
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString(lang === 'en' ? 'en-US' : 'ko-KR', { year:'numeric', month:'short', day:'numeric' }) : '';
  const ago = (d) => { const s = (Date.now() - new Date(d)) / 1000;
    if (s < 3600) return t('min', Math.max(1, Math.round(s/60))); if (s < 86400) return t('hour', Math.round(s/3600));
    return t('day', Math.round(s/86400)); };

  function classify(name) {
    const n = name.toLowerCase();
    let os = 'other';
    if (/\.apk$|\.aab$|android/.test(n)) os = 'android';
    else if (/win|windows|\.exe$|\.msi$|\.msix|\.appx/.test(n)) os = 'win';
    else if (/mac|darwin|osx|\.dmg$|\.pkg$/.test(n)) os = 'mac';
    else if (/linux|\.appimage$|\.deb$|\.rpm$|\.flatpak$|\.snap$/.test(n)) os = 'linux';
    const arch = /arm64|aarch64/.test(n) ? 'arm64' : /x64|amd64|x86_64/.test(n) ? 'x64' : /x86|i[36]86|win32/.test(n) ? 'x86' : /universal/.test(n) ? 'universal' : '';
    return { os, arch };
  }

  function detectOS() {
    const ua = navigator.userAgent.toLowerCase();
    const p = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
    if (/android/.test(ua)) return 'android';
    if (/win/.test(p) || /windows/.test(ua)) return 'win';
    if (/mac/.test(p) || /mac os/.test(ua)) return /iphone|ipad/.test(ua) ? 'other' : 'mac';
    if (/linux/.test(p) || /linux/.test(ua)) return 'linux';
    return 'other';
  }
  const userOS = detectOS();

  // 데이터 로드: Actions가 만든 data/repos.json 우선 → 없으면 GitHub API 직접 호출(30분 캐시)
  async function loadData() {
    try {
      const r = await fetch('data/repos.json', { cache: 'no-cache' });
      if (r.ok) return await r.json();
    } catch {}
    return loadFromApi();
  }

  // 실시간 보정: repos.json 생성 이후의 새 릴리스·새 공개 저장소를 조직 이벤트로 찾아 해당 저장소만 API로 읽어 반영
  // (조직 이벤트 1회 + 바뀐 저장소 수만큼 호출, 5분 캐시 → 방문자 IP당 60회 제한에 여유)
  const relOf = (rel) => rel && { tag: rel.tag_name, name: rel.name || rel.tag_name, url: rel.html_url,
    publishedAt: rel.published_at, prerelease: rel.prerelease,
    assets: (rel.assets || []).filter((a) => !/\.(sha256|sha512|sig|asc|blockmap|ya?ml|txt|json|cer|aab)$|checksums?/i.test(a.name))
      .map((a) => ({ name: a.name, size: a.size, downloads: a.download_count, url: a.browser_download_url })) };
  const pickLatest = (list) => { list = (list || []).filter((x) => !x.draft)
    .sort((a, b) => new Date(b.published_at) - new Date(a.published_at)); return list.find((x) => !x.prerelease) || list[0] || null; };
  async function liveReleases(data, cfg) {
    const KEY = 'mh-live-v2';
    try { const c = JSON.parse(localStorage.getItem(KEY)); if (c && c.g === data.generatedAt && Date.now() - c.t < 5*60*1000) return c.d; } catch {}
    const api = (p) => fetch('https://api.github.com' + p, { headers: { Accept: 'application/vnd.github+json' } })
      .then((r) => r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error('GitHub API ' + r.status)));
    const since = new Date(data.generatedAt);
    const events = ((await api(`/orgs/${ORG}/events?per_page=100`)) || []).filter((e) => new Date(e.created_at) > since);
    const names = new Set(data.repos.map((r) => r.name));
    const hidden = new Set([...(cfg.hide || []), '.github', ORG + '.github.io'].map((x) => x.toLowerCase()));
    const repoOf = (e) => e.repo.name.split('/')[1];
    // 기존 저장소: 새 릴리스만 다시 읽음
    const changed = [...new Set(events.filter((e) => e.type === 'ReleaseEvent').map(repoOf).filter((n) => names.has(n)))];
    // 새 공개 저장소: 생성(CreateEvent repository)·공개 전환(PublicEvent)·목록에 없는 저장소의 릴리스
    const fresh = [...new Set(events.filter((e) => e.type === 'PublicEvent' || e.type === 'ReleaseEvent' ||
      (e.type === 'CreateEvent' && e.payload?.ref_type === 'repository')).map(repoOf)
      .filter((n) => !names.has(n) && !hidden.has(n.toLowerCase())))];
    const d = { rel: {}, add: [] };
    const latest = (n) => api(`/repos/${ORG}/${n}/releases?per_page=30`).then((l) => relOf(pickLatest(l)));
    await Promise.all([
      ...changed.map(async (n) => { try { d.rel[n] = await latest(n); } catch {} }),
      ...fresh.map(async (n) => {
        try {
          const r = await api(`/repos/${ORG}/${n}`);
          if (!r || r.private || r.fork || r.archived) return;
          const o = (cfg.overrides || {})[r.name] || {};
          d.add.push({ name: r.name, displayName: o.displayName || r.name, description: o.description ?? r.description ?? '',
            url: r.html_url, homepage: o.homepage || r.homepage || '', web: o.web || '', language: r.language, topics: r.topics || [],
            stars: r.stargazers_count, pushedAt: r.pushed_at, icon: o.icon && /^https?:/.test(o.icon) ? o.icon : null, ...i18nFields(o),
            screenshots: [], release: await latest(r.name).catch(() => null) });
        } catch {}
      }),
    ]);
    try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), g: data.generatedAt, d })); } catch {}
    return d;
  }

  async function loadFromApi() {
    const KEY = 'mh-cache-v1';
    try { const c = JSON.parse(localStorage.getItem(KEY)); if (c && Date.now() - c.t < 30*60*1000) return c.d; } catch {}
    const api = (p) => fetch('https://api.github.com' + p, { headers: { Accept: 'application/vnd.github+json' } })
      .then((r) => r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error('GitHub API ' + r.status)));
    const list = await api(`/orgs/${ORG}/repos?type=public&per_page=100`);
    const repos = await Promise.all(list.filter((r) => !r.fork && !r.archived && r.name !== '.github' &&
      r.name.toLowerCase() !== ORG.toLowerCase() + '.github.io').map(async (r) => {
      const rel = await api(`/repos/${ORG}/${r.name}/releases?per_page=30`).then(pickLatest).catch(() => null);
      return { name: r.name, displayName: r.name, description: r.description || '', url: r.html_url,
        homepage: r.homepage || '', language: r.language, topics: r.topics || [], pushedAt: r.pushed_at, stars: r.stargazers_count,
        release: rel && { tag: rel.tag_name, name: rel.name || rel.tag_name, url: rel.html_url,
          publishedAt: rel.published_at, prerelease: rel.prerelease,
          assets: rel.assets.filter((a) => !/\.(sha256|sha512|sig|asc|blockmap|ya?ml|txt|json|cer|aab)$|checksums?/i.test(a.name))
            .map((a) => ({ name: a.name, size: a.size, downloads: a.download_count, url: a.browser_download_url })) } };
    }));
    repos.sort((a, b) => (!!b.release - !!a.release) || new Date(b.release?.publishedAt || b.pushedAt) - new Date(a.release?.publishedAt || a.pushedAt));
    const d = { org: ORG, generatedAt: new Date().toISOString(), repos, live: true };
    try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d })); } catch {}
    return d;
  }

  function assetBtn(a, primary) {
    const { os, arch } = classify(a.name);
    const archLabel = os === 'mac' ? ({ arm64: 'Apple Silicon', x64: 'Intel', universal: 'Universal' }[arch] || '') : arch;
    const label = primary ? t('dlFor', `${osLabel(os)}${archLabel ? ' ' + archLabel : ''}`) : a.name;
    return `<a class="btn${primary ? ' primary' : ''}" href="${esc(a.url)}" title="${esc(a.name)}" rel="nofollow">
      <span class="l">${ICONS[os]}<span class="fname">${esc(label)}</span></span><span class="sz">${fmtSize(a.size)}</span></a>`;
  }

  // 앱 저장소의 screenshots/ 폴더를 방문할 때마다 다시 읽어, 빌드 뒤에 추가·교체한 이미지도 바로 보이게 한다.
  // 언어 폴더(screenshots/en, screenshots/ko)가 있으면 지금 언어 것을 쓴다. 10분 캐시, 읽지 못하면 빌드 때 목록 그대로
  let liveShots = {};
  async function loadRepoShots(repos) {
    const KEY = 'mh-shots-v1', TTL = 10*60*1000, IMG = /\.(png|jpe?g|webp|gif)$/i;
    let cache = {};
    try { cache = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
    const api = (p) => fetch('https://api.github.com' + p, { headers: { Accept: 'application/vnd.github+json' } })
      .then((r) => r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error('GitHub API ' + r.status)));
    const images = (items) => (Array.isArray(items) ? items : []).filter((f) => f.type === 'file' && IMG.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true })).map((f) => f.download_url);
    await Promise.all(repos.filter((r) => !r.external && !r.shotsFixed).map(async (r) => {
      if (cache[r.name] && Date.now() - cache[r.name].t < TTL) return;
      try {
        const ref = r.branch ? '?ref=' + encodeURIComponent(r.branch) : '';
        const root = await api(`/repos/${ORG}/${r.name}/contents/screenshots${ref}`);
        const v = { t: Date.now(), all: images(root), lang: {} };
        for (const d of (Array.isArray(root) ? root : []).filter((f) => f.type === 'dir' && /^(en|ko)$/i.test(f.name)))
          v.lang[d.name.toLowerCase()] = images(await api(`/repos/${ORG}/${r.name}/contents/${d.path}${ref}`));
        cache[r.name] = v;
      } catch {}
    }));
    try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch {}
    return cache;
  }
  // 우선순위: 지금 언어 폴더 → screenshots/ 바로 아래 → 다른 언어 폴더 → 빌드 때 목록
  function shotsOf(r) {
    const c = liveShots[r.name];
    if (c) {
      const other = Object.values(c.lang).find((l) => l.length);
      const s = c.lang[lang]?.length ? c.lang[lang] : c.all.length ? c.all : other;
      if (s && s.length) return s;
    }
    return r.screenshots || [];
  }

  function shotsHtml(r) {
    const s = shotsOf(r);
    if (!s.length) return '';
    const n = s.length;
    return `<div class="shots" data-shots="${esc(JSON.stringify(s))}">
      <div class="track">${s.map((u, i) => `<button class="slide" data-i="${i}" aria-label="${esc(t('shotOpen', loc(r, 'displayName'), i + 1, n))}"><img src="${esc(u)}" alt="${esc(t('shotAlt', loc(r, 'displayName'), i + 1))}" loading="lazy" draggable="false"></button>`).join('')}</div>
      ${n > 1 ? `<button class="nav prev" aria-label="${t('shotPrev')}">‹</button><button class="nav next" aria-label="${t('shotNext')}">›</button>
      <div class="dots">${s.map((_, i) => `<span class="dot${i ? '' : ' on'}"></span>`).join('')}</div>` : ''}</div>`;
  }
  const shotIndex = (t) => Math.round(t.scrollLeft / Math.max(1, t.clientWidth));
  const shotGo = (box, i) => { const t = box.querySelector('.track'), n = t.children.length; t.scrollTo({ left: ((i + n) % n) * t.clientWidth }); };
  document.addEventListener('scroll', (e) => {
    const t = e.target; if (!t.classList?.contains('track')) return;
    const i = shotIndex(t);
    t.parentElement.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));
  }, true);

  // 스크린샷 라이트박스
  const lb = document.createElement('div');
  lb.id = 'lb'; lb.hidden = true;
  const lbLabels = () => [['.lb-x', 'close'], ['.lb-p', 'prev'], ['.lb-n', 'next']].forEach(([sel, k]) => lb.querySelector(sel).setAttribute('aria-label', t(k)));
  lb.innerHTML = '<button class="lb-x">×</button><button class="lb-p">‹</button><img alt=""><button class="lb-n">›</button><div class="lb-c"></div>';
  lbLabels();
  document.body.appendChild(lb);
  let lbList = [], lbI = 0;
  const lbShow = () => {
    lb.querySelector('img').src = lbList[lbI];
    lb.querySelector('.lb-c').textContent = lbList.length > 1 ? `${lbI + 1} / ${lbList.length}` : '';
    lb.querySelectorAll('.lb-p, .lb-n').forEach((b) => (b.hidden = lbList.length < 2));
  };
  const lbStep = (d) => { lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); };
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('.shots .nav');
    if (nav) { const box = nav.closest('.shots'); shotGo(box, shotIndex(box.querySelector('.track')) + (nav.classList.contains('next') ? 1 : -1)); return; }
    const sl = e.target.closest('.shots .slide');
    if (sl) { lbList = JSON.parse(sl.closest('.shots').dataset.shots); lbI = +sl.dataset.i; lbShow(); lb.hidden = false; return; }
    if (lb.hidden) return;
    if (e.target.closest('.lb-p')) lbStep(-1);
    else if (e.target.closest('.lb-n')) lbStep(1);
    else if (e.target === lb || e.target.closest('.lb-x')) lb.hidden = true;
  });
  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') lb.hidden = true;
    if (e.key === 'ArrowLeft') lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
  });

  function card(r) {
    const rel = r.release;
    const color = LANG_COLORS[r.language] || '#999';
    let dl = '';
    const web = r.web ? `<div class="dl"><a class="btn primary" href="${esc(r.web)}" title="${t('webTitle')}" target="_blank" rel="noopener">
      <span class="l">${ICONS.web}<span class="fname">${t('webRun')}</span></span><span class="sz">${t('noInstall')}</span></a></div>` : '';
    if (rel && rel.assets.length) {
      const scored = rel.assets.map((a) => { const c = classify(a.name);
        const archScore = userOS === 'mac'
          ? ({ universal: 3, arm64: 2, x64: 1 }[c.arch] || 0)   // Mac: Apple Silicon 우선
          : ({ x64: 2, universal: 2 }[c.arch] || 0);
        const fmtScore = userOS === 'linux' ? (/\.(appimage|deb|tar\.gz)$/i.test(a.name) ? 1 : 0) : (/\.zip$/i.test(a.name) ? 0.5 : 0);
        return { a, s: (c.os === userOS ? 10 : 0) + archScore + fmtScore + (/setup|install|\.msi$|\.dmg$/i.test(a.name) ? 1 : 0) }; })
        .sort((x, y) => y.s - x.s);
      const best = scored[0].s >= 10 ? scored[0].a : null;
      const rest = rel.assets.filter((a) => a !== best);
      dl = `<div class="dl">${best ? assetBtn(best, true) : ''}${!best && rest.length <= 3 ? rest.map((a) => assetBtn(a)).join('') : ''}</div>`;
      if (best || rest.length > 3) {
        const others = best ? rest : rel.assets;
        if (others.length) dl += `<details class="more"><summary>${t('more', others.length)}</summary><div class="dl">${others.map((a) => assetBtn(a)).join('')}</div></details>`;
      }
    } else if (rel) {
      dl = `<div class="norel">${t('noAssets')} <a href="${esc(rel.url)}">${t('notes')}</a></div>`;
    } else if (!web) {
      dl = `<div class="norel">${t('noBuild')}</div>`;
    }
    dl = web + dl;
    const name = loc(r, 'displayName') || r.name, desc = loc(r, 'description');
    // 검색은 두 언어 이름·설명 모두에서
    const q = [name, r.name, r.displayName, r.displayNameEn, r.displayNameKo, desc, r.description, r.descriptionEn, r.descriptionKo,
      r.language, ...r.topics].filter(Boolean).join(' ').toLowerCase();
    return `<article class="card" data-app="${esc(r.name)}" data-rel="${rel ? 1 : 0}" data-q="${esc(q)}">
      <div class="card-top"><div class="ttl">${r.icon ? `<img class="app-ico" src="${esc(r.icon)}" alt="" width="40" height="40" loading="lazy">` : `<span class="app-ico ph">${esc((name || '?')[0])}</span>`}<h2>${r.page ? `<a href="${lang === 'ko' ? 'ko/' : ''}apps/${esc(slugOf(r.name))}/">${esc(name)}</a>` : esc(name)}</h2></div>
        ${rel ? `<a class="ver${rel.prerelease ? ' pre' : ''}" href="${esc(rel.url)}" title="${esc(rel.name)}">${esc(rel.tag)}${rel.prerelease ? ' · pre' : ''}</a>` : ''}</div>
      <p class="desc${desc ? '' : ' empty'}">${esc(desc || t('noDesc'))}</p>
      <div class="tags">${r.language ? `<span class="tag lang" style="--dot:${color}">${esc(r.language)}</span>` : ''}${r.topics.slice(0, 4).map((tp) => `<span class="tag">${esc(tp)}</span>`).join('')}</div>
      ${shotsHtml(r)}
      ${dl}
      <div class="foot"><span>${rel ? t('released', fmtDate(rel.publishedAt)) : t('updated', fmtDate(r.pushedAt))}</span>
        ${r.external ? '' : `<button class="star" type="button" data-repo="${esc(r.name)}" aria-pressed="false" title="${t('starGive')}"><span class="si">☆</span><span class="sn">${Number(r.stars) || 0}</span></button>`}</div>
    </article>`;
  }

  // ★ GitHub 별: 팝업으로 GitHub App 로그인 → 토큰은 이 브라우저(localStorage)에만 보관
  const STAR_API = 'https://minaryhub-star.vercel.app';
  const AUTH_KEY = 'mh-star-auth';
  const starred = {};   // repo -> true/false (로그인한 사용자 기준)
  let auth = null, me = null, pendingStar = null;
  try { auth = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch {}
  if (auth && auth.expiresAt && auth.expiresAt < Date.now()) auth = null;
  const saveAuth = (a) => { auth = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch {} };
  const gh = (method, path) => fetch('https://api.github.com' + path, { method,
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + auth.token, 'X-GitHub-Api-Version': '2022-11-28' } })
    .then((r) => { if (r.status === 401) { logout(); throw new Error('auth'); } return r; });

  function paintStar(btn) {
    const on = !!starred[btn.dataset.repo];
    btn.setAttribute('aria-pressed', on);
    btn.querySelector('.si').textContent = on ? '★' : '☆';
    btn.title = auth ? t(on ? 'starUnset' : 'starSet') : t('starLogin');
  }
  function paintStars() { document.querySelectorAll('.star').forEach(paintStar); }
  function paintAuth() {
    const el = $('#auth');
    if (!auth) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = `GitHub: <b>${esc(me || t('signedIn'))}</b> · <button type="button" id="logout">${t('logout')}</button>`;
    $('#logout').onclick = logout;
  }
  function logout() { saveAuth(null); me = null; for (const k in starred) delete starred[k]; paintAuth(); paintStars(); }
  async function loadStarState() {
    if (!auth) return;
    try {
      const u = await gh('GET', '/user'); if (u.ok) me = (await u.json()).login; paintAuth();
      await Promise.all([...new Set([...document.querySelectorAll('.star')].map((b) => b.dataset.repo))].map(async (n) => {
        const r = await gh('GET', `/user/starred/${ORG}/${n}`); starred[n] = r.status === 204;
      }));
      paintStars();
    } catch {}
  }
  async function toggleStar(btn) {
    const n = btn.dataset.repo, on = !!starred[n];
    btn.disabled = true;
    try {
      const r = await gh(on ? 'DELETE' : 'PUT', `/user/starred/${ORG}/${n}`);
      if (r.status !== 204) throw new Error('GitHub ' + r.status);
      starred[n] = !on;
      document.querySelectorAll(`.star[data-repo="${CSS.escape(n)}"]`).forEach((b) => {
        const c = b.querySelector('.sn'); c.textContent = Math.max(0, (+c.textContent || 0) + (on ? -1 : 1)); paintStar(b); });
    } catch (e) { if (e.message !== 'auth') alert(t('starFail', e.message)); }
    finally { btn.disabled = false; }
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== STAR_API || !e.data || e.data.type !== 'mh-star-auth') return;
    if (e.data.error) { alert(t('loginFail', e.data.error)); pendingStar = null; return; }
    saveAuth({ token: e.data.token, expiresAt: e.data.expiresAt });
    const p = pendingStar; pendingStar = null;
    loadStarState().then(() => { const b = p && document.querySelector(`.star[data-repo="${CSS.escape(p)}"]`); if (b && !starred[p]) toggleStar(b); });
  });
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.star'); if (!btn) return;
    if (auth) return toggleStar(btn);
    pendingStar = btn.dataset.repo;
    const w = 520, h = 680, x = Math.max(0, (screen.width - w) / 2), y = Math.max(0, (screen.height - h) / 2);
    if (!window.open(STAR_API + '/api/login', 'mh-star-login', `popup,width=${w},height=${h},left=${x},top=${y}`))
      alert(t('popup'));
  });

  // 방문·다운로드 통계: 익명 방문자 ID(이 브라우저에만 저장)와 이벤트 종류만 보냅니다. 국가는 서버가 판별합니다.
  // 사이트 주인은 주소에 ?notrack=1 을 붙여 한 번 열면 이 브라우저의 기록이 빠집니다(?notrack=0 으로 해제).
  const track = (() => {
    let vid = null, off = false;
    try {
      const q = new URLSearchParams(location.search).get('notrack');
      if (q === '1') localStorage.setItem('mh-notrack', '1'); else if (q === '0') localStorage.removeItem('mh-notrack');
      off = localStorage.getItem('mh-notrack') === '1';
      vid = localStorage.getItem('mh-vid');
      if (!vid) { vid = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); localStorage.setItem('mh-vid', vid); }
    } catch {}
    if (navigator.webdriver) off = true;
    return (ev) => {
      if (off) return;
      const body = JSON.stringify({ ...ev, vid });
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(STAR_API + '/api/track', new Blob([body], { type: 'text/plain' }))) return;
      } catch {}
      fetch(STAR_API + '/api/track', { method: 'POST', body, keepalive: true, headers: { 'Content-Type': 'text/plain' } }).catch(() => {});
    };
  })();
  track({ type: 'visit' });
  document.addEventListener('click', (e) => {
    const a = e.target.closest('.card a.btn'); if (!a) return;
    track({ type: 'download', app: a.closest('.card')?.dataset.app || '', file: a.title || '' });
  });

  let filter = 'all';
  function applyFilter() {
    const q = $('#q').value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('.card').forEach((el) => {
      const ok = (filter === 'all' || el.dataset.rel === '1') && (!q || el.dataset.q.includes(q));
      el.hidden = !ok; if (ok) shown++;
    });
    $('#empty')?.remove();
    if (!shown) $('#grid').insertAdjacentHTML('beforeend', `<div class="state" id="empty">${t('noMatch')}</div>`);
  }

  // 화면의 고정 문구를 지금 언어로 바꾸고, 전환 버튼을 누르면 카드까지 다시 그린다
  let rerender = () => {};
  function applyLang() {
    document.documentElement.lang = lang;
    $('#q').placeholder = t('search'); $('#q').setAttribute('aria-label', t('search').replace('…', ''));
    document.querySelectorAll('.chip').forEach((c) => (c.textContent = t(c.dataset.f)));
    $('#footNote').textContent = t('footNote');
    const ld = $('#loading'); if (ld) ld.textContent = t('loading');
    document.querySelectorAll('#langSw a').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    lbLabels();
    document.dispatchEvent(new CustomEvent('mh:lang'));
  }
  // 배포된 페이지에서는 언어별 주소로 이동하고, 미리보기(사전 렌더링 전)에서는 그 자리에서 바꾼다
  $('#langSw').addEventListener('click', (e) => {
    const b = e.target.closest('a[data-lang]'); if (!b) return;
    try { localStorage.setItem('mh-lang', b.dataset.lang); } catch {}
    if (prerendered && b.dataset.lang !== pageLang) return;
    e.preventDefault();
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    applyLang(); rerender();
  });
  applyLang();

  (async () => {
    try {
      const cfg = await fetch('config.json').then((r) => r.ok ? r.json() : {}).catch(() => ({}));
      const applyHeader = () => {
        const title = loc(cfg, 'title'), headline = loc(cfg, 'headline');
        if (title) { $('#title').textContent = title; document.title = headline ? `${title} · ${headline}` : title; }
        $('#tagline').textContent = loc(cfg, 'tagline');
      };
      applyHeader(); rerender = applyHeader;
      const data = await loadData();
      const repos = data.repos;
      // 배포 때 앱 소개 페이지(apps/<앱>/)를 만든 앱 — 카드 제목을 그 페이지로 잇는다
      if (prerendered && !data.live) for (const r of repos) r.page = true;
      // config.apps(저장소 없이 직접 등록한 앱): repos.json에 이미 들어 있지 않을 때(API 직접 호출 등)만 보충
      for (const a of cfg.apps || []) {
        if (!a.name || repos.some((r) => r.name.toLowerCase() === a.name.toLowerCase()) ||
          (cfg.hide || []).some((h) => h.toLowerCase() === a.name.toLowerCase())) continue;
        repos.push({ name: a.name, displayName: a.displayName || a.name, description: a.description || '',
          url: a.url || a.web || '', homepage: a.homepage || a.web || '', web: a.web || '', language: a.language || null,
          topics: a.topics || [], stars: null, pushedAt: a.updated || data.generatedAt, external: true,
          icon: a.icon || null, screenshots: a.screenshots || [], release: null, ...i18nFields(a) });
      }
      let lastLive = 0;
      const render = (nLive) => {
        lastLive = nLive;
        const nRel = repos.filter((r) => r.release).length;
        $('#meta').innerHTML = t('meta', repos.length, nRel, ago(data.generatedAt), nLive, userOS !== 'other' ? osLabel(userOS) : '');
        $('#grid').innerHTML = repos.length ? repos.map(card).join('') : `<div class="state">${t('none')}</div>`;
        if (repos.length) applyFilter();
        paintStars();
      };
      render(0);
      rerender = () => { applyHeader(); render(lastLive); paintAuth(); };
      const shotsKey = () => JSON.stringify(repos.map(shotsOf));
      const before = shotsKey();
      loadRepoShots(repos).then((c) => { liveShots = c; if (shotsKey() !== before) render(lastLive); }).catch(() => {});
      paintAuth(); loadStarState();
      if (!data.live) liveReleases(data, cfg).then((d) => {
        let n = 0;
        for (const r of repos) if (d.rel[r.name] !== undefined) { r.release = d.rel[r.name]; n++; }
        for (const r of d.add) if (!repos.some((x) => x.name === r.name)) { repos.push(r); n++; }
        if (!n) return;
        const cfgOrder = (cfg.order || []).map((x) => x.toLowerCase());
        repos.sort((a, b) => {
          const ia = cfgOrder.indexOf(a.name.toLowerCase()), ib = cfgOrder.indexOf(b.name.toLowerCase());
          if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
          if (!!a.release !== !!b.release) return a.release ? -1 : 1;
          return new Date(b.release?.publishedAt || b.pushedAt) - new Date(a.release?.publishedAt || a.pushedAt);
        });
        render(n);
      }).catch(() => {});
      $('#q').addEventListener('input', applyFilter);
      $('#chips').addEventListener('click', (e) => {
        const b = e.target.closest('.chip'); if (!b) return;
        filter = b.dataset.f;
        document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
        applyFilter();
      });
    } catch (e) {
      const fail = () => { $('#grid').innerHTML = `<div class="state">${esc(t('loadFail', e.message))}<br>
        <a href="https://github.com/${ORG}">${t('viewGitHub')}</a></div>`; };
      fail(); rerender = fail;
    }
  })();
})();
</script>
<script src="contact.js" defer></script>
</body>
</html>
