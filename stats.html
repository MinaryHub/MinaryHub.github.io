<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MinaryHub 통계</title>
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ed; --border: #e3e3de;
    --text: #1b1b19; --muted: #6b6b66; --accent: #2f5bea; --accent-soft: #e8eefe; --ok: #1f8a4c;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #19191c; --surface-2: #222226; --border: #2c2c31;
      --text: #ececee; --muted: #9a9aa3; --accent: #7c9cff; --accent-soft: #1f2640; --ok: #4cc47f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Noto Sans KR", system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 40px 0 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; }
  h1 img { width: 40px; height: 40px; border-radius: 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  .range { display: flex; gap: 6px; }
  .range button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kpi { padding: 16px 18px; min-width: 0; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .v { font: 600 28px "JetBrains Mono", monospace; letter-spacing: -.02em; margin-top: 2px; }
  .kpi .s { color: var(--muted); font-size: 12px; }
  .panel { padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .two .panel { margin-bottom: 0; }
  .chart { width: 100%; height: 200px; display: block; }
  .chart .bar { fill: var(--accent); }
  .chart .bar2 { fill: var(--ok); }
  .chart text { fill: var(--muted); font: 11px "JetBrains Mono", monospace; }
  .chart .grid { stroke: var(--border); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-family: "JetBrains Mono", monospace; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .files { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
  /* 앱·버전별 다운로드 */
  .rel-app { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: var(--surface); }
  .rel-app > summary { cursor: pointer; padding: 12px 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; list-style: none; }
  .rel-app > summary::-webkit-details-marker { display: none; }
  .rel-app > summary::before { content: "▸"; color: var(--muted); width: 12px; }
  .rel-app[open] > summary::before { content: "▾"; }
  .rel-app .nm { font-weight: 600; }
  .rel-app .tots { margin-left: auto; display: flex; gap: 16px; align-items: baseline; }
  .rel-app .tots span { font-size: 12px; color: var(--muted); }
  .rel-app .tots b { font: 600 16px "JetBrains Mono", monospace; color: var(--text); margin-left: 4px; }
  .rel-app .tots .gh b { color: var(--ok); }
  .approx { color: var(--muted); font-size: 11px; margin-right: 2px; }
  .recon { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .recon b { color: var(--text); }
  .rel-body { padding: 0 14px 12px; overflow-x: auto; }
  .rel-body table { min-width: 560px; table-layout: fixed; }
  .rel-body th:nth-child(1) { width: 20%; } .rel-body th:nth-child(2) { width: 20%; } .rel-body th:nth-child(3) { width: 14%; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 0 4px 2px 0; white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .pre { color: #c98a12; font-size: 12px; margin-left: 4px; }
  .rel-files { font-size: 12px; color: var(--muted); }
  .rel-files summary { cursor: pointer; }
  .rel-files li { display: flex; justify-content: space-between; gap: 12px; }
  .rel-files ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 8px 0 0; }
  .zero { color: var(--muted); }
  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: 1fr; } .two .panel { margin-bottom: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><img src="logo.webp" alt="">MinaryHub 통계</h1>
      <div class="sub" id="sub">불러오는 중…</div>
    </div>
    <div class="range" id="range">
      <button data-d="7" aria-pressed="false">7일</button>
      <button data-d="30" aria-pressed="true">30일</button>
      <button data-d="90" aria-pressed="false">90일</button>
      <button data-d="365" aria-pressed="false">1년</button>
    </div>
  </header>
  <main id="main"><div class="state">불러오는 중…</div></main>
  <section class="panel" id="rel" style="margin-top:16px"><h2>앱 버전별 다운로드</h2><div class="state" style="padding:24px 0">불러오는 중…</div></section>
  <footer>방문자는 브라우저별 익명 ID로 셉니다(IP 미저장). 국가는 접속 IP로 서버가 판별한 값입니다. "다운로드 클릭"과 버전별 표의 "사이트 클릭"은 같은 값으로, 이 사이트의 다운로드·웹 실행 버튼을 누른 횟수입니다. "GitHub 누적"은 GitHub 릴리스 파일의 누적 다운로드 수(사이트 밖 포함)라 값이 다릅니다. · <a href="./">MinaryHub로 돌아가기</a></footer>
</div>
<script>
(() => {
  const API = 'https://minaryhub-star.vercel.app/api/stats';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (n) => Number(n || 0).toLocaleString('ko-KR');
  let regionName = (c) => c;
  try { const dn = new Intl.DisplayNames(['ko'], { type: 'region' }); regionName = (c) => { try { return dn.of(c) || c; } catch { return c; } }; } catch {}
  const flag = (c) => /^[A-Z]{2}$/.test(c) ? String.fromCodePoint(...[...c].map((ch) => 0x1F1E6 + ch.charCodeAt(0) - 65)) : '🌐';
  const country = (c) => c === '??' ? '<span>🌐 알 수 없음</span>' : `${flag(c)} ${esc(regionName(c))} <span class="sub">${esc(c)}</span>`;

  function chart(daily, days) {
    // 빈 날짜도 0으로 채워 연속된 막대로 그림
    const map = Object.fromEntries(daily.map((d) => [d.d, d]));
    const list = [];
    const today = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
    for (let i = days - 1; i >= 0; i--) {
      const t = new Date(today); t.setDate(t.getDate() - i);
      const k = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
      list.push({ d: k, ...(map[k] || { visits: 0, visitors: 0, downloads: 0 }) });
    }
    const W = 1000, H = 200, L = 36, B = 22, T = 8;
    const max = Math.max(1, ...list.map((d) => Math.max(d.visitors, d.downloads)));
    const step = (W - L) / list.length, bw = Math.max(1, step * 0.38);
    const y = (v) => H - B - (v / max) * (H - B - T);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = Math.round(max * i / 4), yy = y(v);
      g += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`; }
    const every = Math.ceil(list.length / 8);
    list.forEach((d, i) => {
      const x = L + i * step + step * 0.1;
      g += `<rect class="bar" x="${x}" y="${y(d.visitors)}" width="${bw}" height="${H - B - y(d.visitors)}"><title>${d.d} 방문자 ${d.visitors} · 방문 ${d.visits}</title></rect>`;
      g += `<rect class="bar2" x="${x + bw}" y="${y(d.downloads)}" width="${bw}" height="${H - B - y(d.downloads)}"><title>${d.d} 다운로드 ${d.downloads}</title></rect>`;
      if (i % every === 0) g += `<text x="${x + bw}" y="${H - 6}" text-anchor="middle">${d.d.slice(5).replace('-', '/')}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="일별 방문자와 다운로드">${g}</svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>방문자</span><span><i style="background:var(--ok)"></i>다운로드</span></div>`;
  }

  // 사이트 클릭(서버 집계)과 GitHub 누적(downloads.json)을 한 화면에서 맞춰 보여 주려고 둘 다 기억해 둔다
  let cur = null, curDays = 30, dl = null, dlErr = null;
  const labelOf = (name) => dl?.apps.find((a) => a.name === name)?.displayName || name;

  async function load(days) {
    $('#main').innerHTML = '<div class="state">불러오는 중…</div>';
    try {
      const s = await fetch(`${API}?days=${days}`).then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
      cur = s; curDays = days;
      renderMain(s, days);
    } catch (e) {
      $('#main').innerHTML = `<div class="state">통계를 불러오지 못했습니다. (${esc(e.message)})</div>`;
      cur = null; renderReleases();
    }
  }

  function renderMain(s, days) {
      const since = s.all.since ? new Date(s.all.since).toLocaleDateString('ko-KR') : null;
      $('#sub').textContent = since ? `${since}부터 수집 · 최근 ${days}일 기준` : '아직 수집된 기록이 없습니다';
      const maxC = Math.max(1, ...s.countries.map((c) => c.visitors));
      const maxA = Math.max(1, ...s.apps.map((a) => a.downloads));
      $('#main').innerHTML = `
        <section class="kpis">
          <div class="kpi"><div class="l">방문자</div><div class="v">${num(s.range.visitors)}</div><div class="s">전체 ${num(s.all.visitors)}</div></div>
          <div class="kpi"><div class="l">방문 수</div><div class="v">${num(s.range.visits)}</div><div class="s">전체 ${num(s.all.visits)}</div></div>
          <div class="kpi"><div class="l">다운로드 클릭</div><div class="v">${num(s.range.downloads)}</div><div class="s">전체 ${num(s.all.downloads)}</div></div>
          <div class="kpi"><div class="l">접속 국가</div><div class="v">${num(s.countries.filter((c) => c.country !== '??').length)}</div><div class="s">최근 ${days}일</div></div>
          <div class="kpi" id="kpiGh"><div class="l">GitHub 누적 다운로드</div><div class="v">…</div><div class="s">모든 버전 · 사이트 밖 포함</div></div>
        </section>
        <section class="panel"><h2>일별 추이</h2>${chart(s.daily, days)}</section>
        <div class="two">
          <section class="panel"><h2>앱별 다운로드 <span class="sub">(사이트 클릭 · 최근 ${days}일)</span></h2>${s.apps.length ? `<table><thead><tr><th>앱</th><th class="n">클릭</th><th class="n">사람</th></tr></thead><tbody>
            ${s.apps.map((a) => `<tr><td>${esc(a.app ? labelOf(a.app) : '(알 수 없음)')}<div class="meter"><span style="width:${a.downloads / maxA * 100}%"></span></div>
              <div class="files">${a.files.slice(0, 3).map((f) => `${esc(f.file)} ${f.n}`).join(' · ')}${a.files.length > 3 ? ` 외 ${a.files.length - 3}개` : ''}</div></td>
              <td class="n">${num(a.downloads)}</td><td class="n">${num(a.people)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">아직 다운로드 기록이 없습니다.</div>'}</section>
          <section class="panel"><h2>접속 국가</h2>${s.countries.length ? `<table><thead><tr><th>국가</th><th class="n">방문자</th><th class="n">방문</th><th class="n">다운로드</th></tr></thead><tbody>
            ${s.countries.map((c) => `<tr><td>${country(c.country)}<div class="meter"><span style="width:${c.visitors / maxC * 100}%"></span></div></td>
              <td class="n">${num(c.visitors)}</td><td class="n">${num(c.visits)}</td><td class="n">${num(c.downloads)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">아직 방문 기록이 없습니다.</div>'}</section>
        </div>`;
      renderReleases();
  }

  // ── 앱·버전별 다운로드: GitHub 릴리스 파일의 누적 다운로드 수 (data/downloads.json, 배포 때 갱신) ──
  const OS = { win: 'Windows', mac: 'macOS', linux: 'Linux', android: 'Android', other: '기타' };
  function osOf(name) {
    const n = name.toLowerCase();
    if (/\.apk$|\.aab$|android/.test(n)) return 'android';
    if (/mac|darwin|osx|\.dmg$|\.pkg$/.test(n)) return 'mac';   // "darwin"에 "win"이 들어 있어 macOS를 먼저
    if (/win|\.exe$|\.msi$|\.msix|\.appx/.test(n)) return 'win';
    if (/linux|\.appimage$|\.deb$|\.rpm$|\.flatpak$|\.snap$/.test(n)) return 'linux';
    return 'other';
  }
  const SHOWN = 10;   // 버전이 많은 앱은 최근 몇 개만 먼저 보여 줌
  const ago = (d) => { const s = (Date.now() - new Date(d)) / 1000;
    return s < 3600 ? Math.max(1, Math.round(s / 60)) + '분 전' : s < 86400 ? Math.round(s / 3600) + '시간 전' : Math.round(s / 86400) + '일 전'; };
  const day = (d) => d ? new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' }) : '';

  // 사이트 클릭(파일 이름)을 버전에 대응시킨다. 같은 파일 이름이 여러 버전에 있으면(예: 포터블 exe) 가장 최신 버전에 합치고 ≈로 표시
  function attribute(app) {
    const idx = {};
    for (const v of app.releases) for (const f of v.assets) (idx[f.name] ||= []).push(v.tag);   // 릴리스는 최신순
    const byTag = {}, approx = new Set();
    let other = 0, listed = 0, web = 0;
    for (const f of app.clicks?.files || []) {
      listed += f.n;
      // "웹에서 바로 실행" 버튼도 다운로드 클릭으로 세어져 왔다 (파일 이름이 'web' 또는 옛 표기)
      if (/^(web|웹 앱 실행|open the web app)$/i.test(f.file)) { web += f.n; continue; }
      const tags = idx[f.file];
      if (!tags) { other += f.n; continue; }
      byTag[tags[0]] = (byTag[tags[0]] || 0) + f.n;
      if (tags.length > 1) approx.add(tags[0]);
    }
    other += Math.max(0, (app.clicks?.downloads || 0) - listed);   // 파일 목록에 다 안 실린 클릭도 맞춰 둔다
    return { byTag, approx, other, web };
  }

  function versionRow(v, max, att) {
    const by = {};
    for (const a of v.assets) by[osOf(a.name)] = (by[osOf(a.name)] || 0) + a.downloads;
    const chips = Object.keys(OS).filter((k) => by[k]).map((k) => `<span class="chip">${OS[k]} <b>${num(by[k])}</b></span>`).join('');
    const files = v.assets.length ? `<details class="rel-files"><summary>파일 ${v.assets.length}개</summary><ul>${
      [...v.assets].sort((a, b) => b.downloads - a.downloads).map((a) => `<li><span>${esc(a.name)}</span><span>${num(a.downloads)}</span></li>`).join('')}</ul></details>` : '';
    const c = att.byTag[v.tag] || 0;
    return `<tr><td><a href="${esc(v.url)}" rel="noopener">${esc(v.tag)}</a>${v.prerelease ? '<span class="pre">pre</span>' : ''}<div class="files">${day(v.publishedAt)}</div></td>
      <td class="n${v.total ? '' : ' zero'}">${num(v.total)}<div class="meter"><span style="width:${v.total / max * 100}%"></span></div></td>
      <td class="n${c ? '' : ' zero'}">${att.approx.has(v.tag) && c ? '<span class="approx" title="같은 파일 이름을 쓰는 이전 버전의 클릭이 함께 들어 있을 수 있습니다">≈</span>' : ''}${num(c)}</td>
      <td>${chips || '<span class="zero">—</span>'}${files}</td></tr>`;
  }

  function releasesPanel(d, s) {
    // 같은 이름(저장소 이름)으로 두 데이터를 짝짓는다. 릴리스가 없는 앱의 클릭도 빠뜨리지 않는다
    const clicks = Object.fromEntries((s?.apps || []).map((a) => [a.app, a]));
    const apps = d.apps.map((a) => ({ ...a, clicks: clicks[a.name] || null }));
    for (const a of s?.apps || []) if (!d.apps.some((x) => x.name === a.app))
      apps.push({ name: a.app, displayName: a.app || '(알 수 없음)', total: 0, releases: [], clicks: a });
    apps.sort((a, b) => b.total - a.total || (b.clicks?.downloads || 0) - (a.clicks?.downloads || 0) || a.displayName.localeCompare(b.displayName));
    if (!apps.length) return '<div class="empty">릴리스가 있는 앱이 아직 없습니다.</div>';
    const grand = apps.reduce((n, a) => n + a.total, 0);
    const clickSum = apps.reduce((n, a) => n + (a.clicks?.downloads || 0), 0);
    const kpi = s ? s.range.downloads : null;
    const tie = s ? (clickSum === kpi
      ? `사이트 클릭 합계 <b>${num(clickSum)}</b>회는 위쪽 "다운로드 클릭"과 같은 값입니다.`
      : `사이트 클릭 합계 <b>${num(clickSum)}</b>회 (위쪽 "다운로드 클릭" ${num(kpi)}회 중 앱별로 집계된 분).`) : '';
    return `<div class="sub" style="margin:-6px 0 4px"><b>GitHub 누적</b>은 모든 버전의 릴리스 파일을 받은 횟수 총 <b>${num(grand)}</b>회(앱 ${d.apps.length}개, ${ago(d.generatedAt)} 갱신·1시간마다)입니다. 사이트 밖의 직접 링크와 앱의 자동 업데이트 다운로드도 들어 있고, 체크섬·업데이트 정보 파일은 뺐으며, GitHub는 누적 값만 알려 주므로 기간 선택은 적용되지 않습니다.</div>
      <div class="sub" style="margin:0 0 12px"><b>사이트 클릭</b>은 최근 ${curDays}일 동안 이 사이트의 다운로드 버튼을 누른 횟수입니다. ${tie}${s ? ' 같은 파일 이름을 쓰는 버전(예: 포터블 exe)의 클릭은 가장 최신 버전에 합쳐 ≈로 표시합니다.' : ' (사이트 클릭 통계를 불러오지 못해 GitHub 누적만 표시합니다.)'}</div>` +
      apps.map((a, i) => {
        const att = attribute(a);
        const max = Math.max(1, ...a.releases.map((v) => v.total));
        const head = a.releases.slice(0, SHOWN), rest = a.releases.slice(SHOWN);
        const clickTot = a.clicks?.downloads || 0;
        const webRow = att.web ? `<tr><td colspan="2"><span class="zero">웹에서 바로 실행 (설치 없음)</span></td><td class="n">${num(att.web)}</td><td class="zero">실행 버튼도 다운로드 클릭으로 함께 집계됩니다</td></tr>` : '';
        const otherRow = att.other ? `<tr><td colspan="2"><span class="zero">버전을 알 수 없는 클릭</span></td><td class="n">${num(att.other)}</td><td class="zero">릴리스에 없는 파일(이전 이름·삭제된 릴리스 등)</td></tr>` : '';
        return `<details class="rel-app"${i === 0 ? ' open' : ''}><summary><span class="nm">${esc(a.displayName)}</span><span class="sub">버전 ${a.releases.length}개</span>
            <span class="tots"><span class="gh">GitHub 누적<b>${num(a.total)}</b></span><span>사이트 클릭<b>${num(clickTot)}</b></span></span></summary>
          <div class="rel-body"><table><thead><tr><th>버전</th><th class="n">GitHub 누적</th><th class="n">사이트 클릭</th><th>플랫폼 · 파일</th></tr></thead>
            <tbody>${head.map((v) => versionRow(v, max, att)).join('')}</tbody>
            ${rest.length ? `<tbody hidden>${rest.map((v) => versionRow(v, max, att)).join('')}</tbody>` : ''}
            <tbody>${webRow}${otherRow}</tbody></table>${rest.length ? `<button class="more" type="button">이전 버전 ${rest.length}개 더 보기</button>` : ''}</div></details>`;
      }).join('');
  }

  // 데이터 두 가지(사이트 클릭, GitHub 누적)가 모두 준비되거나 바뀔 때마다 그린다
  function renderReleases() {
    const box = $('#rel');
    if (!dl) {
      box.innerHTML = `<h2>앱 버전별 다운로드</h2><div class="${dlErr ? 'empty' : 'state'}" style="padding:${dlErr ? '12px 0' : '24px 0'}">${dlErr
        ? `버전별 다운로드를 불러오지 못했습니다. (${esc(dlErr.message)}) 다음 배포 뒤에 나타납니다.` : '불러오는 중…'}</div>`;
      return;
    }
    box.innerHTML = '<h2>앱 버전별 다운로드</h2>' + releasesPanel(dl, cur);
    const k = $('#kpiGh .v'); if (k) k.textContent = num(dl.apps.reduce((n, a) => n + a.total, 0));
  }
  async function loadReleases() {
    try {
      dl = await fetch('data/downloads.json', { cache: 'no-cache' }).then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
    } catch (e) { dlErr = e; }
    if (cur) renderMain(cur, curDays);   // 앱 이름 표기(표시 이름)도 맞추려고 위쪽까지 다시 그린다
    else renderReleases();
  }
  $('#rel').addEventListener('click', (e) => {
    const b = e.target.closest('.more'); if (!b) return;
    b.previousElementSibling.querySelector('tbody[hidden]')?.removeAttribute('hidden'); b.remove();
  });

  $('#range').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#range button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    load(+b.dataset.d);
  });
  load(30);
  loadReleases();
})();
</script>
</body>
</html>
